name: Telegram Notify
description: Send a Telegram notification about CI/CD status

inputs:
  bot-token:
    description: Telegram bot token
    required: true
  channel-id:
    description: Telegram channel/chat ID
    required: true
  status:
    description: "Status: success or failure"
    required: true
  title:
    description: Notification title (e.g. "Tests Passed", "Deployed to Staging")
    required: true
  enabled:
    description: '"true" sends this alert even while alerts are switched off for everyone below'
    default: "false"

runs:
  using: composite
  steps:
    - name: Send Telegram notification
      shell: bash
      env:
        BOT_TOKEN: ${{ inputs.bot-token }}
        CHANNEL_ID: ${{ inputs.channel-id }}
        STATUS: ${{ inputs.status }}
        TITLE: ${{ inputs.title }}
        RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        # ON/OFF SWITCH for every repo's Telegram alerts (app, site, radar, tests,
        # new projects). Omar turned them off on 2026-11-01. Set to "true" to turn
        # them back on everywhere.
        ALERTS_ON="false"
        if [ "${ALERTS_ON}" != "true" ] && [ "${{ inputs.enabled }}" != "true" ]; then
          echo "Telegram alerts are switched off (shared-assets/actions/telegram-notify)."
          exit 0
        fi

        # A missing secret should say so, not fail quietly with a Telegram 404.
        if [ -z "${BOT_TOKEN}" ] || [ -z "${CHANNEL_ID}" ]; then
          echo "::warning::No Telegram alert sent: add TELEGRAM_NOTIFIER_TOKEN and TELEGRAM_CHANNEL_ID to this repo's secrets (or share the org secrets with it)."
          exit 0
        fi

        if [ "${STATUS}" = "success" ]; then
          ICON="✅"
        elif [ "${STATUS}" = "failure" ]; then
          ICON="❌"
        else
          ICON="⚠️"
        fi

        TEXT="${ICON} <b>${TITLE}</b>

        📦 <code>${GITHUB_REPOSITORY}</code>
        🔀 <code>${GITHUB_REF_NAME}</code>
        👤 ${GITHUB_ACTOR}

        <a href='${RUN_URL}'>View Run</a>"

        RESPONSE="$(curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
          --data-urlencode "chat_id=${CHANNEL_ID}" \
          --data-urlencode "parse_mode=HTML" \
          --data-urlencode "text=${TEXT}")"
        if ! printf '%s' "${RESPONSE}" | grep -q '"ok":true'; then
          echo "::warning::Telegram did not accept the alert: ${RESPONSE}"
        fi
