name: Security scan

# Weekly, free checks that need no secrets: are our live sites locked down?
# The Claude security-check skill reads the result and does the deeper work.

on:
  schedule:
    - cron: "0 5 * * 1" # Mondays 05:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe live sites
        run: bash scripts/security/probe-sites.sh
