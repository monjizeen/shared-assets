name: Flutter Test

# Reusable workflow for Flutter consumer repos (`uses: …/flutter-test.yml@main`).
# This repository has no Flutter app, so real tests must not run here.
# push/pull_request exist only so GitHub records a passing run on shared-assets
# instead of the stale Apr 2026 "workflow file issue" failures from invalid
# `secrets` in `if:` clauses.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/flutter-test.yml"
  pull_request:
    paths:
      - ".github/workflows/flutter-test.yml"
  workflow_call:
    inputs:
      format-paths:
        description: Paths to check formatting (space-separated)
        type: string
        default: "."
      test-paths:
        description: Paths to run tests on (space-separated)
        type: string
        default: ""
    secrets:
      TELEGRAM_NOTIFIER_TOKEN:
        required: false
      TELEGRAM_CHANNEL_ID:
        required: false

jobs:
  host-repo:
    if: github.event_name != 'workflow_call'
    runs-on: ubuntu-latest
    steps:
      - name: Skip Flutter tests on shared-assets
        run: |
          echo "flutter-test is a reusable workflow for consumer Flutter repos."
          echo "shared-assets has no Flutter app; skipping tests."

  test:
    if: github.event_name == 'workflow_call'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Flutter
        uses: monjizeen/shared-assets/actions/setup-flutter@main

      - name: Check formatting
        run: dart format --set-exit-if-changed ${{ inputs.format-paths }}

      - name: Analyze
        run: flutter analyze
        continue-on-error: true

      - name: Run tests
        run: flutter test

      - name: Notify Telegram - Passed
        if: success()
        uses: monjizeen/shared-assets/actions/telegram-notify@main
        with:
          bot-token: ${{ secrets.TELEGRAM_NOTIFIER_TOKEN }}
          channel-id: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          status: success
          title: "Tests Passed"

      - name: Notify Telegram - Failed
        if: failure()
        uses: monjizeen/shared-assets/actions/telegram-notify@main
        with:
          bot-token: ${{ secrets.TELEGRAM_NOTIFIER_TOKEN }}
          channel-id: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          status: failure
          title: "Tests Failed"
